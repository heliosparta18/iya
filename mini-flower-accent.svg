<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <!-- Mini Blush Rose Gradients -->
    <radialGradient id="miniRoseOuter" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C26B4B"/>
      <stop offset="45%" stop-color="#DB8765"/>
      <stop offset="85%" stop-color="#F2B294"/>
      <stop offset="100%" stop-color="#FDE2D4"/>
    </radialGradient>
    <radialGradient id="miniRoseMid" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#994125"/>
      <stop offset="50%" stop-color="#BA5E3D"/>
      <stop offset="90%" stop-color="#DC896A"/>
      <stop offset="100%" stop-color="#F8CBB7"/>
    </radialGradient>
    <radialGradient id="miniRoseCore" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6E2812"/>
      <stop offset="65%" stop-color="#9E4627"/>
      <stop offset="100%" stop-color="#C56D4D"/>
    </radialGradient>

    <!-- Foliage Gradient -->
    <linearGradient id="miniLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4828"/>
      <stop offset="60%" stop-color="#5E7841"/>
      <stop offset="100%" stop-color="#88A963"/>
    </linearGradient>

    <!-- Baby's breath floret -->
    <radialGradient id="floretGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="75%" stop-color="#F7EADB"/>
      <stop offset="100%" stop-color="#E5C7AC"/>
    </radialGradient>
  </defs>

  <!-- 1. Stems & Branching Structure -->
  <g id="stems">
    <!-- Main stem curving diagonally -->
    <path d="M 22 118 Q 50 95 72 72 Q 95 48 115 22" stroke="#465533" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Side branch to upper left (bud) -->
    <path d="M 54 85 Q 40 68 32 46" stroke="#465533" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Side branch to upper right (baby's breath) -->
    <path d="M 80 62 Q 102 58 122 66" stroke="#52633C" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M 100 60 Q 112 45 125 40" stroke="#52633C" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M 106 61 Q 116 75 126 82" stroke="#52633C" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 2. Leaves with Midrib Veins -->
  <g id="leaves">
    <!-- Leaf 1 near base -->
    <g transform="translate(38, 102) rotate(-35)">
      <path d="M 0 0 C 10 -7, 20 -5, 26 0 C 20 5, 10 7, 0 0 Z" fill="url(#miniLeafGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="22" y2="0" stroke="#8EAC68" stroke-width="0.7" opacity="0.65"/>
    </g>
    <!-- Leaf 2 opposite -->
    <g transform="translate(42, 98) rotate(55)">
      <path d="M 0 0 C 9 -6, 18 -4, 23 0 C 18 4, 9 6, 0 0 Z" fill="url(#miniLeafGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#8EAC68" stroke-width="0.7" opacity="0.65"/>
    </g>
    <!-- Leaf 3 near flower -->
    <g transform="translate(62, 80) rotate(-65)">
      <path d="M 0 0 C 11 -8, 22 -6, 28 0 C 22 6, 11 8, 0 0 Z" fill="url(#miniLeafGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="#8EAC68" stroke-width="0.7" opacity="0.65"/>
    </g>
    <!-- Leaf 4 under flower -->
    <g transform="translate(86, 62) rotate(40)">
      <path d="M 0 0 C 10 -7, 20 -5, 25 0 C 20 5, 10 7, 0 0 Z" fill="url(#miniLeafGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.4"/>
      <line x1="0" y1="0" x2="21" y2="0" stroke="#8EAC68" stroke-width="0.7" opacity="0.65"/>
    </g>
  </g>

  <!-- 3. Baby's Breath Mini Florets (Delicate 5-petaled accents) -->
  <g id="gypsophila">
    <!-- Floret 1 -->
    <g transform="translate(122, 66)">
      <circle cx="-3" cy="0" r="2.2" fill="url(#floretGrad)"/>
      <circle cx="3" cy="0" r="2.2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="-3" r="2.2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="3" r="2.2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="0" r="1.4" fill="#E5A965"/>
    </g>
    <!-- Floret 2 -->
    <g transform="translate(125, 40)">
      <circle cx="-2.6" cy="0" r="2" fill="url(#floretGrad)"/>
      <circle cx="2.6" cy="0" r="2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="-2.6" r="2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="2.6" r="2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="0" r="1.2" fill="#E5A965"/>
    </g>
    <!-- Floret 3 -->
    <g transform="translate(126, 82)">
      <circle cx="-2.6" cy="0" r="2" fill="url(#floretGrad)"/>
      <circle cx="2.6" cy="0" r="2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="-2.6" r="2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="2.6" r="2" fill="url(#floretGrad)"/>
      <circle cx="0" cy="0" r="1.2" fill="#E5A965"/>
    </g>
    <!-- Floret 4 at tip -->
    <g transform="translate(115, 22)">
      <circle cx="-2.8" cy="0" r="2.1" fill="url(#floretGrad)"/>
      <circle cx="2.8" cy="0" r="2.1" fill="url(#floretGrad)"/>
      <circle cx="0" cy="-2.8" r="2.1" fill="url(#floretGrad)"/>
      <circle cx="0" cy="2.8" r="2.1" fill="url(#floretGrad)"/>
      <circle cx="0" cy="0" r="1.3" fill="#E5A965"/>
    </g>
  </g>

  <!-- 4. Mini Rosebud on Upper-Left Branch -->
  <g transform="translate(32, 46) rotate(-35)">
    <!-- Calyx base -->
    <path d="M -4 4 C -3 0, 3 0, 4 4 Z" fill="#4B5E34"/>
    <!-- Petal tip emerging -->
    <path d="M -3 2 C -4 -7, -2 -12, 0 -14 C 2 -12, 4 -7, 3 2 Z" fill="url(#miniRoseMid)"/>
    <path d="M -1 -2 C 0 -11, 2 -9, 0 -14 Z" fill="url(#miniRoseCore)"/>
    <!-- Sepals wrapping bud -->
    <path d="M -4 3 C -6 -4, -4 -11, -2 -15 C -3 -9, -3 -4, -2 3 Z" fill="#586E3C"/>
    <path d="M 4 3 C 6 -4, 4 -11, 2 -15 C 3 -9, 3 -4, 2 3 Z" fill="#586E3C"/>
  </g>

  <!-- 5. Main Dainty Garden Rose Blossom (Center 72, 70) -->
  <g transform="translate(74, 68)">
    <!-- Sepal tips peeking behind rose -->
    <path d="M 0 0 L -18 14 L -8 6 Z" fill="#485B33"/>
    <path d="M 0 0 L 16 16 L 8 6 Z" fill="#485B33"/>
    <path d="M 0 0 L 18 -12 L 8 -4 Z" fill="#485B33"/>
    <path d="M 0 0 L -16 -14 L -6 -6 Z" fill="#485B33"/>

    <!-- Tier 1: Outer Petals (5 broad cupped petals) -->
    <path d="M 0 0 C 12 -22, 26 -16, 24 -2 C 22 10, 10 14, 0 0 Z" fill="url(#miniRoseOuter)" stroke="rgba(255,240,230,0.5)" stroke-width="0.5"/>
    <path d="M 0 0 C 22 -6, 26 12, 14 22 C 4 24, -4 16, 0 0 Z" fill="url(#miniRoseOuter)" stroke="rgba(255,240,230,0.5)" stroke-width="0.5"/>
    <path d="M 0 0 C 6 22, -12 26, -22 14 C -24 4, -16 -4, 0 0 Z" fill="url(#miniRoseOuter)" stroke="rgba(255,240,230,0.5)" stroke-width="0.5"/>
    <path d="M 0 0 C -22 6, -26 -12, -14 -22 C -4 -24, 4 -16, 0 0 Z" fill="url(#miniRoseOuter)" stroke="rgba(255,240,230,0.5)" stroke-width="0.5"/>
    <path d="M 0 0 C -6 -22, 12 -26, 22 -14 C 24 -4, 16 4, 0 0 Z" fill="url(#miniRoseOuter)" stroke="rgba(255,240,230,0.5)" stroke-width="0.5"/>

    <!-- Tier 2: Mid Petals (5 overlapping cupped whorls) -->
    <path d="M 0 0 C 8 -16, 18 -12, 16 -2 C 14 8, 6 10, 0 0 Z" fill="url(#miniRoseMid)" stroke="rgba(255,240,230,0.4)" stroke-width="0.4"/>
    <path d="M 0 0 C 16 -4, 18 8, 10 16 C 2 18, -4 12, 0 0 Z" fill="url(#miniRoseMid)" stroke="rgba(255,240,230,0.4)" stroke-width="0.4"/>
    <path d="M 0 0 C 4 16, -8 18, -16 10 C -18 2, -12 -4, 0 0 Z" fill="url(#miniRoseMid)" stroke="rgba(255,240,230,0.4)" stroke-width="0.4"/>
    <path d="M 0 0 C -16 4, -18 -8, -10 -16 C -2 -18, 4 -12, 0 0 Z" fill="url(#miniRoseMid)" stroke="rgba(255,240,230,0.4)" stroke-width="0.4"/>
    <path d="M 0 0 C -4 -16, 8 -18, 16 -10 C 18 -2, 12 4, 0 0 Z" fill="url(#miniRoseMid)" stroke="rgba(255,240,230,0.4)" stroke-width="0.4"/>

    <!-- Tier 3: Inner Petals & Rose Heart -->
    <path d="M -7 -3 C -10 5, -3 11, 5 9 C 11 8, 12 1, 8 -5 C 5 -10, -3 -9, -7 -3 Z" fill="url(#miniRoseCore)"/>
    <path d="M -5 -1 C -2 5, 5 5, 6 1 C 7 -3, 2 -5, -1 -4 C -4 -4, -6 -2, -5 -1 Z" fill="#581E0C" stroke="rgba(255,230,200,0.6)" stroke-width="0.6"/>
    <!-- Delicate central stamen dots -->
    <circle cx="0" cy="0" r="1.5" fill="#E5A965"/>
    <circle cx="-1.5" cy="1.2" r="0.8" fill="#FFF2DF"/>
    <circle cx="1.5" cy="-1.2" r="0.8" fill="#FFF2DF"/>
  </g>
</svg>